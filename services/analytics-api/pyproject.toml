[project]
name = "analytics-api"
version = "0.1.0"
description = "StreamShop analytics API — ClickHouse aggregates and Postgres order detail"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.8",
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
analytics-api = "analytics_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
