x-catalog-api: &catalog-api
  build:
    context: ./services/catalog-api
    dockerfile: Dockerfile
  env_file:
    - path: ./services/catalog-api/.env
      required: false
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s
  restart: unless-stopped

services:
  traefik:
    image: traefik:v3.6
    container_name: streamshop-traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: streamshop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamshop}
      POSTGRES_DB: ${POSTGRES_DB:-streamshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  order-api:
    build:
      context: ./services/order-api
      dockerfile: Dockerfile
    container_name: streamshop-order-api
    ports:
      - "${ORDER_API_PORT:-3002}:${ORDER_API_PORT:-3002}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.order-api.rule=PathPrefix(`/api/orders`)
      - traefik.http.routers.order-api.entrypoints=web
      - traefik.http.services.order-api.loadbalancer.server.port=${ORDER_API_PORT:-3002}
    env_file:
      - path: ./services/order-api/.env
        required: false
    environment:
      PORT: ${ORDER_API_PORT:-3002}
      SERVICE_NAME: ${ORDER_API_SERVICE_NAME:-order-api}
      DATABASE_URL: ${DATABASE_URL:-postgres://streamshop:streamshop@postgres:5432/streamshop?sslmode=disable}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: streamshop-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-streamshop}
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: streamshop-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: streamshop-redisinsight
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: streamshop
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5540/api/health/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: streamshop-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streamshop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streamshop}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: streamshop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streamshop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streamshop}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: on-failure

  redpanda:
    image: redpandadata/redpanda:v26.2.1
    container_name: streamshop-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk cluster health | grep -E 'Healthy:.+true' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v3.10.0
    container_name: streamshop-redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8082}:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  catalog-api-1:
    <<: *catalog-api
    container_name: streamshop-catalog-api-1
    ports:
      - "${CATALOG_API_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      SERVICE_NAME: catalog-api-1
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/streamshop}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-streamshop}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamshop}
      S3_BUCKET: ${S3_BUCKET:-product-images}
      S3_REGION: ${S3_REGION:-us-east-1}

  catalog-api-2:
    <<: *catalog-api
    container_name: streamshop-catalog-api-2
    ports:
      - "${CATALOG_API_2_PORT:-3011}:3001"
    environment:
      PORT: "3001"
      SERVICE_NAME: catalog-api-2
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/streamshop}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-streamshop}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamshop}
      S3_BUCKET: ${S3_BUCKET:-product-images}
      S3_REGION: ${S3_REGION:-us-east-1}

  nginx:
    image: nginx:1.27-alpine
    container_name: streamshop-nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/catalog-upstream.conf:/etc/nginx/catalog-upstream.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.catalog-api.rule=PathPrefix(`/api/catalog`)
      - traefik.http.routers.catalog-api.entrypoints=web
      - traefik.http.services.catalog-api.loadbalancer.server.port=80
    depends_on:
      catalog-api-1:
        condition: service_healthy
      catalog-api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redisinsight_data:
  minio_data:
  redpanda_data:
