server {
    listen 80;
    server_tokens off;
    absolute_redirect off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /docs/index.html;
    }
}
