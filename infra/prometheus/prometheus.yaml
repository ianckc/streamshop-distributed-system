global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: order-api
    metrics_path: /metrics
    static_configs:
      - targets: ["order-api:3002"]

  - job_name: catalog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-api-1:3001", "catalog-api-2:3001"]

  - job_name: analytics-api
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-api:3003"]

  - job_name: event-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["event-processor:3004"]
