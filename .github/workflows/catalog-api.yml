name: catalog-api

on:
  push:
    branches: [main]
    paths:
      - "services/catalog-api/**"
      - ".github/workflows/catalog-api.yml"
  pull_request:
    paths:
      - "services/catalog-api/**"
      - ".github/workflows/catalog-api.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: services/catalog-api/.nvmrc
          cache: npm
          cache-dependency-path: services/catalog-api/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
